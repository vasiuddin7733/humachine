# Deploy frontend to GitHub Pages (static hosting only).
# Backend services cannot run on GitHub Pages — point VITE_*_URL vars at
# free hosts (Render / Railway / Fly.io) or leave unset for demo UI.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE_PATH: /humachine/
          VITE_API_GATEWAY_URL: ${{ vars.VITE_API_GATEWAY_URL }}
          VITE_CATALOG_SERVICE_URL: ${{ vars.VITE_CATALOG_SERVICE_URL }}
          VITE_LISTING_SERVICE_URL: ${{ vars.VITE_LISTING_SERVICE_URL }}
          VITE_PROMOTION_SERVICE_URL: ${{ vars.VITE_PROMOTION_SERVICE_URL }}
          VITE_WORKER_SERVICE_URL: ${{ vars.VITE_WORKER_SERVICE_URL }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
